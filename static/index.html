<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAF AI Dashboard - TCC</title>
    <style>
        /* Estética Premium (Dark Mode & Glassmorphism) */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #0f172a, #020617);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 40px;
        }

        h1 { margin: 0; font-weight: 800; font-size: 2rem; color: #38bdf8; }
        h1 span { color: #10b981; }
        p.subtitle { margin: 5px 0 0 0; color: #94a3b8; font-size: 0.9rem; }

        .container {
            display: flex;
            width: 90%;
            max-width: 1200px;
            gap: 30px;
        }

        /* Glassmorphism Cards */
        .card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            flex: 1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 { margin-top: 0; font-size: 1.2rem; color: #e2e8f0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }

        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #cbd5e1; font-size: 0.9rem; }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(15, 23, 42, 0.7);
            color: #fff;
            font-family: monospace;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }
        input[type="text"]:focus { outline: none; border-color: #38bdf8; }

        button {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4); }

        /* Dashboard Log */
        .log-container {
            height: 350px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 10px;
        }

        .log-container::-webkit-scrollbar { width: 8px; }
        .log-container::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

        .log-item {
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 5px;
            animation: slideIn 0.3s ease-out;
            background: rgba(15, 23, 42, 0.8);
            border-left: 5px solid transparent;
        }

        .log-item.permitido { border-color: #10b981; }
        .log-item.bloqueado { border-color: #ef4444; }

        .log-item .status { font-weight: 800; }
        .log-item.permitido .status { color: #10b981; }
        .log-item.bloqueado .status { color: #ef4444; }

        .log-item .latency { color: #f59e0b; font-family: monospace; }
        .log-item .payload { color: #94a3b8; font-family: monospace; word-break: break-all; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>WAF <span>Security Panel</span></h1>
        <p class="subtitle">Monitoramento e Detecção de Anomalias em Tempo Real</p>
    </header>

    <div class="container">
        <!-- Lado Esquerdo: Simulador de Ataque -->
        <div class="card">
            <h2>Simulador de Requisições HTTP</h2>
            <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 25px;">
                Simule um acesso ao sistema enviando um parâmetro de busca. O WAF interceptará essa requisição antes de chegar ao servidor.
            </p>
            
            <div class="input-group">
                <label>Payload (O que vai na URL):</label>
                <input type="text" id="payloadInput" placeholder="Ex: sapatos de corrida ou ' OR 1=1--" value="sapatos">
            </div>

            <button onclick="enviarRequisicao()">Enviar Requisição para /busca</button>

            <div style="margin-top: 30px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 8px;">
                <label style="color: #cbd5e1;">Resposta do Servidor:</label>
                <pre id="serverResponse" style="color: #e2e8f0; font-size: 0.8rem; white-space: pre-wrap; font-family: monospace; margin: 10px 0 0 0;">Aguardando ação...</pre>
            </div>
        </div>

        <!-- Lado Direito: Log do WAF -->
        <div class="card">
            <h2>Live WAF Activity Logs</h2>
            <div class="log-container" id="logContainer">
                <!-- Logs aparecerão aqui via JS -->
            </div>
        </div>
    </div>

    <script>
        async function enviarRequisicao() {
            const payload = document.getElementById('payloadInput').value;
            const logContainer = document.getElementById('logContainer');
            const serverResponse = document.getElementById('serverResponse');
            
            serverResponse.innerText = "Processando...";
            
            try {
                // Medir tempo da chamada no front (opcional, backend já manda a dele)
                const res = await fetch(`/busca?q=${encodeURIComponent(payload)}`);
                
                // CORREÇÃO CRÍTICA DE FRONTEND (Tratamento de Exceções Silenciosas)
                if (!res.ok && res.status !== 403) {
                    throw new Error(`Erro de Servidor: HTTP ${res.status}`);
                }
                
                const data = await res.json();
                
                // Formatar a resposta bruta
                serverResponse.innerText = JSON.stringify(data, null, 2);
                
                // Adicionar no Log do Dashboard
                const isBlocked = res.status === 403;
                const latencia = data.latencia_ms || data.latencia_waf_ms || 0;
                
                adicionarLog(
                    isBlocked ? 'BLOQUEADO' : 'PERMITIDO',
                    payload,
                    latencia
                );

            } catch (error) {
                serverResponse.innerText = "Erro ao conectar com a API.";
            }
        }

        function adicionarLog(status, payload, latencia) {
            const container = document.getElementById('logContainer');
            const div = document.createElement('div');
            
            const isBlocked = status === 'BLOQUEADO';
            div.className = `log-item ${isBlocked ? 'bloqueado' : 'permitido'}`;
            
            // CORREÇÃO CRÍTICA DE SEGURANÇA (Prevenindo DOM XSS no próprio Painel)
            // Em vez de injetar o texto direto no innerHTML, nós escapamos ele
            const escapedPayload = document.createElement('div');
            escapedPayload.textContent = payload;
            
            div.innerHTML = `
                <div>
                    <span class="status">${isBlocked ? 'HTTP 403 - ATAQUE NEUTRALIZADO' : 'HTTP 200 - TRÁFEGO LEGÍTIMO'}</span>
                </div>
                <div class="payload">Payload: /busca?q=${escapedPayload.innerHTML}</div>
                <div class="latency">Latência WAF: ${Number(latencia).toFixed(2)} ms</div>
            `;
            
            // Adiciona no topo
            container.insertBefore(div, container.firstChild);
        }
    </script>
</body>
</html>
